<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Financy — חיסכון</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Google+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="theme.css" />
</head>
<body>
  <div class="phone theme-midnight">

    <!-- Status bar -->
    <div class="status-bar" aria-hidden="true">
      <img class="sb-notch" src="assets/notch.svg" width="32" height="32" alt="" />
      <img class="sb-time" src="assets/time.svg" width="54" height="21" alt="" />
      <img class="sb-signal" src="assets/mobile-signal.svg" width="17" height="10.667" alt="" />
      <img class="sb-wifi" src="assets/wifi.svg" width="15.2725" height="10.966" alt="" />
      <img class="sb-battery-outline" src="assets/battery-outline.svg" width="22" height="11.3333" alt="" />
      <img class="sb-battery-cap" src="assets/battery-cap.svg" width="1.32804" height="4" alt="" />
      <img class="sb-battery-fill" src="assets/battery-fill.svg" width="18" height="7.33333" alt="" />
    </div>

    <!-- Header -->
    <header class="h-bar">
      <a class="h-icon-btn" href="index.html" aria-label="חזרה">
        <svg class="h-flip" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>
      </a>
      <h1 class="h-bar-title">חיסכון</h1>
      <button class="h-icon-btn" type="button" aria-label="הוספת יעד חיסכון">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
      </button>
    </header>

    <main class="h-content h-content--goals">

      <article class="h-goal h-goal--dark" style="--progress:50%">
        <span class="h-orb h-orb--goal" aria-hidden="true"></span>
        <span class="h-ring h-ring--goal" aria-hidden="true"></span>
        <div class="h-goal-head">
          <span class="h-tx-icon h-tx-icon--on-dark"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="3" width="11" height="18" rx="3"/><path d="M10.5 18h3"/></svg></span>
          <h2 class="h-goal-title">Iphone 13 Mini</h2>
        </div>
        <div class="h-goal-stats">
          <p class="h-goal-row"><span class="h-on-dark-muted">יתרה</span><span class="h-on-dark-muted">50%</span></p>
          <span class="h-progress h-progress--on-dark" role="progressbar" aria-valuenow="50" aria-valuemin="0" aria-valuemax="100"><span></span></span>
          <p class="h-goal-row"><span><span class="h-goal-saved">$300</span> <span class="h-on-dark-muted">מתוך $699</span></span><span class="h-on-dark-muted">נותרו 14 ימים</span></p>
        </div>
        <a class="h-pill h-pill--light h-pill--small" href="#iphone">לפרטים</a>
      </article>

      <article class="h-goal" style="--progress:71%">
        <div class="h-goal-head">
          <span class="h-tx-icon"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="11" rx="3"/><path d="M2.5 19h19"/></svg></span>
          <h2 class="h-goal-title">Macbook Pro M1</h2>
        </div>
        <div class="h-goal-stats">
          <p class="h-goal-row"><span class="h-muted">יתרה</span><span class="h-muted">60%</span></p>
          <span class="h-progress" role="progressbar" aria-valuenow="60" aria-valuemin="0" aria-valuemax="100"><span></span></span>
          <p class="h-goal-row"><span><span class="h-goal-saved">$300</span> <span class="h-muted">מתוך $1,499</span></span><span class="h-muted">נותרו 30 ימים</span></p>
        </div>
        <a class="h-pill h-pill--lilac h-pill--small" href="#macbook">לפרטים</a>
      </article>

      <article class="h-goal" style="--progress:50%">
        <div class="h-goal-head">
          <span class="h-tx-icon"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="15" r="4"/><path d="m11 12 8-8"/><path d="m16 7 2 2"/><path d="m14 9 1.5 1.5"/></svg></span>
          <h2 class="h-goal-title">רכב</h2>
        </div>
        <div class="h-goal-stats">
          <p class="h-goal-row"><span class="h-muted">יתרה</span><span class="h-muted">50%</span></p>
          <span class="h-progress" role="progressbar" aria-valuenow="50" aria-valuemin="0" aria-valuemax="100"><span></span></span>
          <p class="h-goal-row"><span><span class="h-goal-saved">$10,000</span> <span class="h-muted">מתוך $20,000</span></span><span class="h-muted">נותרו 30 ימים</span></p>
        </div>
        <a class="h-pill h-pill--lilac h-pill--small" href="#car">לפרטים</a>
      </article>

      <article class="h-goal" style="--progress:50%">
        <div class="h-goal-head">
          <span class="h-tx-icon"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V19a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M10 21v-5h4v5"/></svg></span>
          <h2 class="h-goal-title">דירה</h2>
        </div>
        <div class="h-goal-stats">
          <p class="h-goal-row"><span class="h-muted">יתרה</span><span class="h-muted">50%</span></p>
          <span class="h-progress" role="progressbar" aria-valuenow="50" aria-valuemin="0" aria-valuemax="100"><span></span></span>
          <p class="h-goal-row"><span><span class="h-goal-saved">$65,000</span> <span class="h-muted">מתוך $30,500</span></span><span class="h-muted">נותרו 3 שנים</span></p>
        </div>
        <a class="h-pill h-pill--lilac h-pill--small" href="#house">לפרטים</a>
      </article>
    </main>

    <div class="home-indicator-bar" aria-hidden="true"><div class="home-indicator h-home-indicator"></div></div>
  </div>
</body>
</html>
